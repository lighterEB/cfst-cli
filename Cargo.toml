[package]
name = "cfst"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.1", default-features = false, features = [
    "blocking",
    "json",
    "rustls",        # TLS 支持
] }
clap = { version = "4.0", features = ["derive"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22.1"

[profile.release]
strip = true          # 移除符号表和调试信息
lto = true            # 启用链接时优化
codegen-units = 1     # 单代码生成单元，更好的优化效果
panic = "abort"       # panic 时直接终止，不生成展开代码
opt-level = "z"       # 优化二进制大小
